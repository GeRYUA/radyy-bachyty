<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111117">
<title>Запрошення</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  min-height: 100vh;
  display: grid;
  place-items: center;
  overflow: hidden;
  padding: 24px;
  background:
    radial-gradient(ellipse at 50% 35%, rgba(106, 77, 125, .26), transparent 55%),
    linear-gradient(145deg, #19171f, #0d0d12 70%);
  color: #f7f2fa;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}
.card {
  position: relative;
  z-index: 1;
  width: min(100%, 680px);
  padding: clamp(28px, 7vw, 58px) clamp(22px, 6vw, 48px);
  text-align: center;
  border: 1px solid rgba(226, 207, 241, .18);
  border-radius: 28px;
  background: rgba(255, 255, 255, .035);
  box-shadow: 0 24px 90px rgba(0, 0, 0, .24);
  backdrop-filter: blur(8px);
  animation: card-in 1.1s cubic-bezier(.2,.8,.2,1) both;
}
.eyebrow {
  margin: 0 0 22px;
  color: #cbb5dd;
  font-size: .82rem;
  letter-spacing: .22em;
  text-transform: uppercase;
  animation: fade-in 1.3s .25s both;
}
.rule {
  width: 46px;
  height: 1px;
  margin: 0 auto 24px;
  background: #cbb5dd;
  opacity: .9;
}
h1 {
  margin: 0;
  font-size: clamp(2rem, 7.2vw, 3.65rem);
  line-height: 1.22;
  font-weight: 450;
  letter-spacing: -.035em;
  text-wrap: balance;
  animation: text-in 1.1s .2s both;
}
.sub {
  margin: 24px 0 0;
  color: #d6cbdc;
  font-size: clamp(1rem, 3.5vw, 1.2rem);
  line-height: 1.7;
  animation: fade-in 1.2s .65s both;
}
.emoji {
  display: inline-block;
  margin-top: 24px;
  font-size: 2rem;
  animation: float 2.8s ease-in-out infinite;
}
.sparkle {
  position: fixed;
  pointer-events: none;
  opacity: 0;
  animation: drift var(--duration, 8s) linear infinite;
  animation-delay: var(--delay, 0s);
  font-size: var(--size, 20px);
  filter: drop-shadow(0 0 8px rgba(223, 190, 245, .22));
}
.s1 { left: 10%; --duration: 9s; --delay: -2s; --size: 18px; }
.s2 { left: 23%; --duration: 11s; --delay: -7s; --size: 14px; }
.s3 { left: 78%; --duration: 10s; --delay: -4s; --size: 21px; }
.s4 { left: 90%; --duration: 12s; --delay: -9s; --size: 16px; }
.s5 { left: 63%; --duration: 13s; --delay: -5s; --size: 13px; }
@keyframes card-in {
  from { opacity: 0; transform: translateY(18px) scale(.985); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes text-in {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes float {
  0%, 100% { transform: translateY(0) rotate(-3deg); }
  50% { transform: translateY(-8px) rotate(3deg); }
}
@keyframes drift {
  0% { top: 110%; opacity: 0; transform: translateX(0) rotate(0deg); }
  12% { opacity: .65; }
  85% { opacity: .55; }
  100% { top: -10%; opacity: 0; transform: translateX(28px) rotate(35deg); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; }
}
</style>
</head>
<body>
  <span class="sparkle s1" aria-hidden="true">✦</span>
  <span class="sparkle s2" aria-hidden="true">♡</span>
  <span class="sparkle s3" aria-hidden="true">✧</span>
  <span class="sparkle s4" aria-hidden="true">♡</span>
  <span class="sparkle s5" aria-hidden="true">✦</span>

  <main class="card">
    <p class="eyebrow">Маю для тебе запрошення</p>
    <div class="rule"></div>
    <h1>Буду радий бачити тебе на своєму дні народження!</h1>
    <p class="sub">Приходь — буду дуже радий 🤍</p>
    <div class="emoji" aria-label="святкові емодзі">🎂 ✨ 🥳</div>
    <div class="rule" style="margin: 24px auto 0"></div>
  </main>
</body>
</html>
